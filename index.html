<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Burbuja</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="screen-start" class="screen active">
    <div class="screen-content">
      <div class="logo-area">
        <div class="bubble-emoji">🫧</div>
        <h1 class="titulo">BURBUJA</h1>
        <p class="subtitulo">¡Esquiva los corales!</p>
      </div>
      <div class="record-badge">🏆 Récord: <span id="high-score-display">0</span></div>
      <button id="btn-play" class="btn btn-primary" aria-label="Jugar">▶ &nbsp; JUGAR</button>
      <p class="instruccion">Toca la pantalla, usa Espacio o Mayús para impulsar la burbuja</p>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div id="hud">
      <span id="score-display">0</span>
      <button id="btn-pause" class="pause-button" aria-label="Pausar juego" title="Pausar (P o Escape)">Ⅱ</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="pause-menu" class="pause-menu oculto" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-card">
        <p class="pause-kicker">BURBUJA</p>
        <h2 id="pause-title">Pausa</h2>
        <p>Respira. El océano te espera.</p>
        <button id="btn-resume" class="btn btn-primary">▶ &nbsp; CONTINUAR</button>
        <button id="btn-restart-pause" class="btn btn-secondary">↺ &nbsp; REINICIAR</button>
        <button id="btn-home-pause" class="btn btn-secondary">⌂ &nbsp; INICIO</button>
      </div>
    </div>
  </div>

  <div id="screen-gameover" class="screen">
    <div class="screen-content">
      <h2 class="gameover-titulo">💥 GAME OVER</h2>
      <div class="result-card">
        <div class="result-fila"><span class="result-label">Puntaje</span><span id="final-score" class="result-valor">0</span></div>
        <div class="separador"></div>
        <div class="result-fila"><span class="result-label">🏆 Récord</span><span id="final-record" class="result-valor record-color">0</span></div>
        <div id="nuevo-record" class="nuevo-record oculto">🎉 ¡Nuevo récord!</div>
      </div>
      <button id="btn-retry" class="btn btn-primary" aria-label="Reintentar">↺ &nbsp; REINTENTAR</button>
      <button id="btn-home" class="btn btn-secondary" aria-label="Volver al inicio">⌂ &nbsp; INICIO</button>
    </div>
  </div>
  <script src="Bubble.js"></script>
  <script src="Obstacle.js"></script>
  <script src="Game.js"></script>
  <script src="UI.js"></script>
</body>
</html>
